# KFS 检测 — MJPG 高帧率模式 (适合 USB 3.0 高速摄像头)
# 用法: ./build/kfs_detect --config config/profiles/mjpg_highfps.yaml

camera:
  type: usb
  usb:
    device: 0
    width: 1280
    height: 1024
    fps: 30
    fourcc: "MJPG"        # JPEG 压缩, 可到高分辨率, 需 CPU 解码

  controls:
    auto_exposure: 1
    exposure: 80
    gain: 0
    brightness: 0
    contrast: 16
    saturation: 32
    white_balance: -1
    sharpness: 1

model:
  path: models/kfs_yolo11_3class.onnx
  input_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.30

display:
  debug: true
