# KFS 检测 — 默认配置 (YUYV 流畅模式)
# 用法: cp config/kfs_config.yaml 或直接使用

camera:
  type: usb
  usb:
    device: 0
    width: 640
    height: 480
    fps: 30
    fourcc: "YUYV"         # 原始 YUV, 零解码延迟

  controls:
    auto_exposure: 1
    exposure: 80
    gain: 0
    brightness: 0
    contrast: 16
    saturation: 32
    white_balance: -1
    sharpness: 1

model:
  path: models/kfs_yolo11_3class.onnx
  input_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.30

display:
  debug: true
