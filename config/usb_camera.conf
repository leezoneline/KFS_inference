# KFS USB 相机参数配置
# 路径: realsense_inference/config/usb_camera.conf
# 用法: ./kfs_detect --camera usb --config config/usb_camera.conf
#
# 所有参数可选, 未指定的使用默认值
# 注释行以 # 开头, 空行忽略

# === 基本参数 ===
# 设备号 (/dev/videoN), 默认 0
device = 0

# 分辨率 (宽×高), 默认 1920×1080
width  = 1280
height = 1024

# 帧率, 默认 30
fps = 180

# 编码格式: MJPG (推荐高帧率) 或 YUYV 或空(自动)
fourcc = MJPG

# === 相机控制 (V4L2 属性) ===
# 曝光模式: -1=不设置(默认), 0=自动, 1=手动
# 设为 1 (手动) 后才由 exposure 控制亮度
auto_exposure = 1

# 手动曝光时间 (V4L2 exposure_time_absolute, 单位: 100µs)
# 范围: 1 ~ 2047, 默认: 166, 越小越暗
exposure = 80

# 增益 → 映射到 gamma: gamma = gain + 100
# 100=中性, 值越小画面越暗但对比度越强
# 保持 100 (gain=0) 最自然
gain = 0

# 亮度 (-64~64), 默认 0
brightness = 0

# 对比度 (0~95), 推荐 16~32, 太高会丢失细节
contrast = 16

# 饱和度 (0~100), 默认 64, 降低以获得真实感
saturation = 32

# 白平衡: -1=自动, 2000~6500 手动色温
# 自动模式画面最自然
white_balance = -1

# 锐度 (1~7), 默认 2
# 设为 1 (最低) 获得柔和自然的画面, 太高会像油画
sharpness = 1
